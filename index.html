<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto-évaluation – Informatique</title>
<style>
:root{--bg:#f7f5ee;--card:#fff;--tx:#1b2440;--mut:#5d6785;--pr:#1e6b4a;--ok:#1f9d63;--bd:#dde2f0;--warn:#d9822b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10152a;--card:#1a2140;--tx:#eaeefc;--mut:#9aa5c9;--pr:#7b9bff;--ok:#4cd197;--bd:#2e3760;--warn:#f0a85c}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
.w{max-width:860px;margin:0 auto;padding:16px}
.hd{background:linear-gradient(135deg,#14284b,#1e6b4a);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px}
.hd h1{margin:0 0 4px;font-size:1.15rem}.hd p{margin:0;opacity:.92;font-size:.92rem}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:1.1rem}h3{margin:14px 0 6px;font-size:1rem}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:.92rem}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:90px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--pr);color:#fff;font-weight:600;margin:6px 6px 0 0}
button.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}
button.big{width:100%;padding:16px;font-size:1.05rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{color:var(--mut);font-size:.88rem}.err{color:#d23b3b;font-weight:600}
.q{border-left:4px solid var(--pr);padding:8px 12px;margin:12px 0;background:var(--bg);border-radius:8px}
.sc{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.sc label{display:flex;align-items:center;gap:6px;font-weight:500;border:1px solid var(--bd);border-radius:999px;padding:6px 12px;margin:0;cursor:pointer}
.sc input{width:auto}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--ok);color:#fff}.tag.cl{background:var(--mut)}
.th{text-align:center;padding:30px 10px}.th .e{font-size:3rem}.th h2{font-size:1.6rem;color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--bg)}
.ov{overflow-x:auto}.qr>*{margin-top:6px}
.hd{display:flex;align-items:center;gap:14px}.hd img{width:84px;height:84px;object-fit:contain;background:#fff;border-radius:50%;padding:4px;flex:none}.hd h1,.hd p{text-shadow:0 1px 3px rgba(0,0,0,.4)}
button{background:linear-gradient(135deg,#14284b,#1e6b4a);box-shadow:0 3px 8px rgba(20,40,75,.3);transition:transform .15s}button:hover{transform:translateY(-2px) scale(1.03)}button.s{box-shadow:none}
.c{border-top:5px solid #1e6b4a}.c:nth-of-type(2n){border-top-color:#14284b}.c:nth-of-type(3n){border-top-color:#c9a227}
.q:nth-child(3n+1){border-left-color:#1e6b4a}.q:nth-child(3n+2){border-left-color:#14284b}.q:nth-child(3n){border-left-color:#c9a227}
.sc label:has(input:checked){background:#f3e3a3;border-color:#c9a227;color:#222}
.em{font-size:2.2rem;text-align:center;letter-spacing:6px;margin:6px 0 12px}.hide{display:none!important}
@media print{body{background:#fff;color:#000}.np{display:none!important}.c{border:0;padding:0}.hd{background:none;color:#000;border:1px solid #000}th{background:#eee}}

function qhtml(q,i){let b;
if(q.type==="texte")b=`<textarea id="t${i}" placeholder="Ta réponse"></textarea>`;
else if(q.type==="echelle")b=`<div class="sc">${SC.map(s=>`<label><input type="radio" name="q${i}" value="${s[1]}">${s[1]}</label>`).join("")}</div><input id="t${i}" placeholder="Commentaire (facultatif)">`;
else{const ty=q.type==="multi"?"checkbox":"radio";b=`<div class="sc">${q.opts.map(o=>`<label><input type="${ty}" name="q${i}" value="${esc(o)}">${esc(o)}</label>`).join("")}</div>${q.type==="multi"?'<p class="m">Plusieurs choix possibles.</p>':""}`}

let db=null,user=null,evals=[],resps=[],prof=false,evId=null,st={};
function mkDb(){const L={evals:[],responses:[]},C={evals:{},responses:{}};
 const ls=()=>{try{return JSON.parse(localStorage.getItem("ae")||"{}")}catch(e){return{}}};
 const fire=()=>{for(const n in L)L[n].forEach(f=>f({docs:Object.entries(C[n]).map(([id,x])=>({id,data:()=>x}))}))};
 const d={_auth:false,async _pull(){
  if(API_URL){const r=await(await fetch(API_URL+"?action=all&key="+encodeURIComponent(KEY))).json();C.evals=r.evals||{};C.responses=r.responses||{};d._auth=!!r.auth}
  else{const s=ls();C.evals=s.evals||{};C.responses=s.responses||{};d._auth=true}
  fire()},
  collection(n){return{onSnapshot(f){L[n].push(f);fire()},doc(id){return{set:x=>w("set",n,id,x),delete:()=>w("delete",n,id)}}}}};
 async function w(op,n,id,x){
  if(API_URL){const r=await(await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({op,col:n,id,data:x,key:KEY})})).json();if(!r.ok)throw 0}
  else{const s=ls();s[n]=s[n]||{};if(op==="set")s[n][id]=x;else delete s[n][id];try{localStorage.setItem("ae",JSON.stringify(s))}catch(e){throw 0}}
  await d._pull()}
 setInterval(()=>{if(!document.hidden)d._pull().catch(()=>{})},15000);d._pull().catch(()=>{});return d}
function out(h){app.innerHTML=h}
async function init(){
 home();
 $("#lg").src=LOGO;
 try{if(window.claude&&claude.use){db=await claude.use("db");user=await claude.use("user")}}catch(e){}
 if(!db&&!(window.claude&&claude.use)){db=mkDb();MODE="site"}
 if(db){
  db.collection("evals").onSnapshot(s=>{evals=s.docs.map(d=>({id:d.id,...d.data()}));refresh()},()=>{});
  db.collection("responses").onSnapshot(s=>{resps=s.docs.map(d=>({id:d.id,...d.data()}));refresh()},()=>{});
 }
}

<div><label>Classe</label><select id="cl">${Array.from({length:14},(_,i)=>i+1).map(i=>`<option>${i}</option>`).join("")}</select></div></div>
<p id="e" class="err"></p><button onclick="go()">Continuer →</button><button class="s" onclick="home()">Retour</button></div>`)}
function active(nv){const t=Date.now();return evals.filter(e=>e.niveau===nv&&e.debut<=t&&t<e.fin).sort((a,b)=>b.debut-a.debut)[0]}
function go(){
 const n=$("#n").value.trim(),p=$("#p").value.trim();
 if(!n||!p){$("#e").textContent="Merci d’écrire ton nom et ton prénom.";return}
 if(!db){$("#e").textContent="Connexion impossible pour le moment. Réessaie plus tard.";return}
 st={v:"form",n,p,nv:$("#nv").value,cl:$("#cl").value};
 const e=active(st.nv);
 if(!e){out(`<div class="c"><h2>Aucune auto-évaluation ouverte</h2><p class="m">Il n’y a pas d’évaluation en cours pour les élèves de ${st.nv}. Reviens plus tard !</p><button onclick="home()">Accueil</button></div>`);return}
 if(resps.some(r=>r.evalId===e.id&&r.nom.toLowerCase()===n.toLowerCase()&&r.prenom.toLowerCase()===p.toLowerCase()&&r.classe===st.cl)){out(`<div class="c"><h2>Déjà envoyé ✅</h2><p class="m">Tu as déjà répondu à cette séance.</p><button onclick="home()">Accueil</button></div>`);return}
 evId=e.id;
 out(`<div class="c"><h2>${esc(e.titre)}</h2><p class="m">${esc(n)} ${esc(p)} · ${st.nv} ${st.cl} · ouverte jusqu’au ${fd(e.fin)}</p>
${e.questions.map((x,i)=>qhtml(normQ(x),i)).join("")}<div class="q"><b>💬 Remarques libres</b><p class="m">Une remarque sur la séance ou une question particulière ? Écris-la ici.</p><textarea id="rem"></textarea></div>
<p id="e" class="err"></p><button onclick="send()">Envoyer mes réponses</button></div>`)
}
async function send(){
 const e=evals.find(x=>x.id===evId);if(!e)return;
 const a=e.questions.map((x,i)=>{const q=normQ(x);if(q.type==="texte")return{v:$("#t"+i).value.trim(),t:""};const r=[...document.querySelectorAll(`input[name=q${i}]:checked`)].map(z=>z.value);return{v:r.join(" ; "),t:q.type==="echelle"?$("#t"+i).value.trim():""}});
 if(a.some((x,i)=>!x.v&&normQ(e.questions[i]).type!=="texte")){$("#e").textContent="Réponds à toutes les questions avant d’envoyer.";return}
 if(Date.now()>=e.fin){$("#e").textContent="Cette évaluation est terminée.";return}
 try{
  await db.collection("responses").doc(evId+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)).set({evalId:evId,nom:st.n,prenom:st.p,niveau:st.nv,classe:st.cl,t:Date.now(),a,rem:$("#rem").value.trim()});
  out(`<div class="th"><img src="${LOGO}" alt="Logo" style="width:110px"><div class="e">🏆🎉🌟</div><h2>Merci, mes champions !</h2><p class="m">Tes réponses ont bien été envoyées à Mme Haddaji.</p><button onclick="home()">Accueil</button></div>`)
 }catch(x){$("#e").textContent="Envoi impossible. Vérifie ta connexion et réessaie."}
}
function tlogin(){st={v:"tl"};out(`<div class="c"><div class="em"><img src="${LOGO}" alt="Logo" style="width:110px"></div><h2>Connexion professeur</h2><label>Identifiant</label><input id="u" autocomplete="username"><label>Mot de passe</label><input id="pw" type="password" autocomplete="current-password">
<p id="e" class="err"></p><button onclick="dologin()">Se connecter</button><button class="s" onclick="home()">Retour</button></div>`)}
async function dologin(){const pw=$("#pw").value;let ok=false;
 if($("#u").value.trim()===LOGIN){if(MODE==="site"&&API_URL){KEY=pw;try{await db._pull();ok=db._auth}catch(x){}}else ok=pw===PASS}
 if(ok){prof=true;tlist()}else $("#e").textContent="Identifiant ou mot de passe incorrect."}
function status(e){return Date.now()<e.fin?`<span class="tag">En cours · jusqu’au ${fd(e.fin)}</span>`:`<span class="tag cl">Clôturée le ${fd(e.fin)}</span>`}
function tlist(){
 if(!prof)return home();st={v:"tlist"};
 const can=db&&(MODE==="site"||(user&&user.canEdit()));
 out(`<div class="c np"><h2>Nouvelle auto-évaluation</h2>${can?"":`<p class="err">Ouvre ce lien avec ton compte Claude (propriétaire) pour créer ou consulter les évaluations.</p>`}
<div class="g2"><div><label>Niveau</label><select id="nv"><option>7ème</option><option>8ème</option></select></div>
<div><label>Durée</label><select id="du"><option value="7">1 semaine</option><option value="14">2 semaines</option><option value="21">3 semaines</option><option value="28">4 semaines</option></select></div></div>
<label>Titre de la séance</label><input id="ti"><label>Questions</label><div id="qb"></div><button class="s" onclick="addQ()">➕ Ajouter une question</button>
<p id="e" class="err"></p><button onclick="launch()">🚀 Lancer l’évaluation</button><button class="s" onclick="prof=false;home()">Déconnexion</button></div>
${["7ème","8ème"].map(nv=>`<div class="c np"><h2>Classes de ${nv}</h2>${evals.filter(e=>e.niveau===nv).sort((a,b)=>b.debut-a.debut).map(e=>`<p><b>${esc(e.titre)}</b> ${status(e)}<br><span class="m">${e.questions.length} questions · ${resps.filter(r=>r.evalId===e.id).length} réponses</span><br><button class="s" onclick="res('${e.id}')">Résultats</button><button class="s" onclick="del('${e.id}')">Supprimer</button></p>`).join("")||'<p class="m">Aucune évaluation.</p>'}</div>`).join("")}`);if(!$("#qb").children.length)addQ()
}
function addQ(){const d=document.createElement("div");d.className="q qr";d.innerHTML=`<input class="qq" placeholder="Écris la question"><select class="qt" onchange="this.parentNode.querySelector('.qo').classList.toggle('hide',!/choix|multi/.test(this.value))"><option value="echelle">Échelle (Je maîtrise / Presque / À revoir)</option><option value="choix">Choix unique</option><option value="multi">Choix multiples</option><option value="texte">Réponse libre</option></select><textarea class="qo hide" placeholder="Choix proposés (un par ligne)"></textarea><button class="s" onclick="this.parentNode.remove()">Retirer</button>`;$("#qb").appendChild(d)}
async function launch(){
 const ti=$("#ti").value.trim();const q=[...document.querySelectorAll(".qr")].map(r=>({q:r.querySelector(".qq").value.trim(),type:r.querySelector(".qt").value,opts:r.querySelector(".qo").value.split("\n").map(s=>s.trim()).filter(Boolean)})).filter(x=>x.q);if(q.some(x=>(x.type==="choix"||x.type==="multi")&&x.opts.length<2)){$("#e").textContent="Ajoute au moins 2 choix aux questions à choix.";return}
 if(!ti||!q.length){$("#e").textContent="Titre et au moins une question requis.";return}
 try{const t=Date.now();await db.collection("evals").doc("e"+t.toString(36)).set({niveau:$("#nv").value,titre:ti,questions:q,debut:t,fin:t+(+$("#du").value)*864e5});tlist()}
 catch(x){$("#e").textContent="Action réservée au propriétaire de la page."}
}
async function del(id){if(confirm("Supprimer cette évaluation ?"))try{await db.collection("evals").doc(id).delete()}catch(x){}}
function res(id){
 evId=id;st={v:"res"};const e=evals.find(x=>x.id===id);if(!e)return tlist();
 const rs=resps.filter(r=>r.evalId===id).sort((a,b)=>a.classe.localeCompare(b.classe)||a.nom.localeCompare(b.nom));
 const cls=[...new Set(rs.map(r=>r.classe))];
 out(`<div class="np"><button class="s" onclick="tlist()">← Retour</button><button onclick="window.print()">🖨️ Imprimer</button><button onclick="csv()">⬇️ CSV</button><button onclick="mail()">✉️ Envoyer par e-mail</button></div>
<div class="c"><h2>${esc(e.titre)} – ${e.niveau}</h2><p class="m">${status(e)} · ${rs.length} réponses · Classes de ${e.niveau} uniquement</p>
${cls.map(c=>`<h3>${e.niveau} ${esc(c)}</h3><div class="ov"><table><tr><th>Élève</th>${e.questions.map((q,i)=>`<th>Q${i+1}</th>`).join("")}</tr>${rs.filter(r=>r.classe===c).map(r=>`<tr><td>${esc(r.nom)} ${esc(r.prenom)}</td>${r.a.map(a=>`<td>${esc(at(a))}${a.t?`<br><i>${esc(a.t)}</i>`:""}</td>`).join("")}</tr>`).join("")}</table></div>`).join("")||'<p class="m">Aucune réponse pour le moment.</p>'}
<h3>Remarques libres</h3>${rs.filter(r=>r.rem).map(r=>`<p><b>${esc(r.nom)} ${esc(r.prenom)}</b> (${e.niveau} ${esc(r.classe)}) : ${esc(r.rem)}</p>`).join("")||'<p class="m">Aucune remarque.</p>'}<h3>Questions</h3><ol>${e.questions.map(q=>`<li>${esc(normQ(q).q)}</li>`).join("")}</ol></div>`)
}
function rows(){const e=evals.find(x=>x.id===evId);return[e,resps.filter(r=>r.evalId===evId)]}
async function csv(){
 const[e,rs]=rows(),q=s=>`"${String(s).replace(/"/g,'""')}"`;
 const L=[["Niveau","Classe","Nom","Prénom",...e.questions.flatMap((x,i)=>["Q"+(i+1),"Commentaire "+(i+1)]),"Remarques"].map(q).join(";")];
 rs.forEach(r=>L.push([r.niveau,r.classe,r.nom,r.prenom,...r.a.flatMap(a=>[at(a),a.t||""]),r.rem||""].map(q).join(";")));
 try{const d=await claude.use("downloads");await d.save({filename:"auto-evaluation-"+e.niveau+".csv",data:"\ufeff"+L.join("\n")})}catch(x){alert("Téléchargement indisponible ; utilise Imprimer.")}
}
function mail(){
 const[e,rs]=rows();let b=e.titre+" ("+e.niveau+") – "+rs.length+" réponses\n\n";
 rs.forEach(r=>{b+=r.niveau+" "+r.classe+" – "+r.nom+" "+r.prenom+" : "+r.a.map((a,i)=>"Q"+(i+1)+"="+at(a)).join(", ")+(r.rem?" | Remarque : "+r.rem:"")+"\n"});
 const s="Résultats auto-évaluation "+e.niveau+" – "+e.titre;
 try{navigator.clipboard.writeText(b)}catch(x){}
 const bd=b.length>1500?b.slice(0,1500)+"\n…(suite : collez le texte complet copié)":b;
 const u="https://mail.google.com/mail/?view=cm&fs=1&to="+EMAIL+"&su="+encodeURIComponent(s)+"&body="+encodeURIComponent(bd);
 if(!window.open(u,"_blank"))location.href="mailto:"+EMAIL+"?subject="+encodeURIComponent(s)+"&body="+encodeURIComponent(bd);
}
init();
</script></body></html>
